const start=async()=>{init();HIST=[];ch.innerHTML='';bot('Hi Arjun! Welcome back');await sleep(300);chips([['Repeat Trip',()=>{user('Repeat Trip');flights()}],['New Trip',()=>{user('New Trip');dates()}]])};
const dates=()=>{bot('Select Date of Departure &amp; Return');card('<div class="cd dt"><div><small>Date of Departure</small><b>Mon, 16 Nov</b></div><div><small>Date of Return</small><b>Sat, 21 Nov</b></div></div>');chips([['Confirm dates',()=>{user('Mon, 16 Nov to Sat, 21 Nov');flights()}]])};
const ask1=()=>{bot('Do you wish to confirm?');chips([['Yes, Confirm',intent],['View all ticket options',()=>{user('View all ticket options');opts(ask1)}],['Maybe later, keep in cart',()=>{user('Maybe later, keep in cart');bot('Saved to your cart. I will hold these fares for 30 minutes (sample).');ask1()}]])};
const flights=async()=>{await think(['Searching the fastest and cheapest flights available...','Filtering Hyd to Vizag all flights...']);card(depCard());card(retCard());ask1()};
const intent=()=>{face();user('Yes, Confirm');bot('Flights held. Tell me about this trip.');chips([[IN,()=>{user(IN);bot('Do you wish to keep your return flight flexible?');chips([['Yes',()=>{user('Yes');S.flex=1;plan()}],['No',()=>{user('No');S.flex=0;plan()}]])}]])};
const plan=async()=>{await think(['Preparing Day - Night itinerary...','Best options of Hotel stay near the beach...','Best local food spots around the city for breakfast, lunch...']);card(itin('Arjun’s Vizag Itinerary'));chips([['Confirm Itinerary',()=>{face();user('Confirm Itinerary');final()}],['Edit',()=>{user('Edit');bot('Let me know if you want me to edit anything from the day wise itinerary?');chips([[HM,()=>{user(HM);final()}]])}]])};
const fc=()=>chips([['Confirm Itinerary',confirm],['Edit',edit2],['Open trip hub',hubOpen]]);
const final=()=>{bot('Sure Arjun! Sending you now your final itinerary for the Vizag trip. Check all the details before making the payment.');card(depCard());card(retCard());card(hotelCard());card(itin('Arjun’s Leisure Vizag Trip Itinerary'));card(why());fc()};
const edit2=()=>{user('Edit');bot('What would you like to change?');chips([['Keep the total under ₹12,000',budget],['My work got extended to Thursday',extended],['Show other departure flights',()=>{user('Show other departure flights');opts(fc)}]])};
const O=[['Indigo','6E-1234','09:35','10:40',4506],['Air India','AI-1234','07:10','08:20',5120],['Indigo','6E-5678','13:50','14:55',3980]];
const opts=back=>{bot('Other departures on Mon, 16 Nov:');chips(O.map(o=>[`${o[0]} ${o[2]} · ${inr(o[4])}`,()=>{user(`${o[0]} ${o[2]}`);const old=S.dep.p;S.dep={air:o[0],no:o[1],t:o[2],a:o[3],p:o[4]};bot(`Switched. Total ${inr(total())} (${o[4]>=old?'+':'−'}${inr(Math.abs(o[4]-old))}). Everything else stays as it is.`);card(depCard());back()}]))};
const budget=async()=>{user('Keep the total under ₹12,000');await think(['Checking 14 flights and 9 stays...','Trying cheaper hotels and dates...']);const b=S.dep.p+S.ret.p;
bot(`I can’t fit this plan under ₹12,000. The closest I found is ${inr(b+6200)}. Here is what each change would do, least disruptive first:`);
chips([[`Cheaper hotel, same dates · ${inr(b+6200)}`,()=>{user('Cheaper hotel, same dates');S.hotel=6200;upd()}],[`Leave Fri 20 Nov, cheaper hotel · ${inr(b+4960)}`,()=>{user('Leave Fri 20 Nov, cheaper hotel');S.hotel=4960;S.nights=4;S.ret.d='Fri, 20 Nov';upd()}],[`Keep my current plan · ${inr(total())}`,()=>{user('Keep my current plan');bot('No changes made.');fc()}]])};
const upd=()=>{bot(`Done. New total ${inr(total())}. Nothing is booked yet.`);card(hotelCard());fc()};
const extended=async()=>{user('My work got extended to Thursday');await think(['Re-planning around your new work dates...']);
card(`<div class="cd"><small>What changed</small>${[['Work and stay','Mon–Thu','Changed'],['Leisure itinerary','20-21 Nov (was 19-21)','Changed'],['Return flight',S.ret.d,'Same'],['Hotel','same nights','Same']].map(r=>`<div class="rw"><span>${r[0]}: ${r[1]}</span><span class="t2 ${r[2]=='Same'?'':'ch'}">${r[2]}</span></div>`).join('')}<small>Total unchanged at ${inr(total())}. Nothing was rebooked, so no change fees.</small></div>`);
chips([['Accept changes',()=>{face();user('Accept changes');S.ext=1;S.leis='20-21 Nov';bot('Updated your itinerary.');card(itin('Arjun’s Leisure Vizag Trip Itinerary'));fc()}],['Undo',()=>{user('Undo');bot('Kept your original plan.');fc()}]])};
const confirm=async()=>{user('Confirm Itinerary');await think(['Checking live fares and availability...']);
if(!S.priced){S.priced=1;bot(`Heads up: the ${S.dep.air} departure fare changed from ${inr(S.dep.p)} to ${inr(S.dep.p+344)} while you were reviewing. Nothing has been booked.`);chips([['Accept new price',()=>{face();user('Accept new price');S.dep.p+=344;bot(`Updated. New total ${inr(total())}.`);fc()}],['See other flights',()=>{user('See other flights');opts(fc)}]]);return}
face();bot('All set. Your itinerary is confirmed for review.');card(`<div class="cd"><b>Ready for payment</b><small>Total ${inr(total())}. Payment is outside this prototype.</small></div>`);chips([['Open trip hub',hubOpen],['Start over',start]])};

let TAB='Itinerary';const TABS=['Itinerary','Map','Budget','Checklist','Safety','Reviews'],V={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PL=[['Rushikonda Beach',0],['Dolphin’s Nose viewpoint',0],['Tenneti Park',0],['Visakha Museum',100]],FD=[['Seafood thali place (sample)',600],['Andhra meals spot (sample)',400],['Beachside café (sample)',500]];
const sum=k=>S.days.reduce((a,d)=>a+d.it.filter(x=>x.k==k).reduce((b,x)=>b+x.c,0),0);
const R=()=>{$('#tabs').innerHTML=TABS.map(t=>`<button class="tab${t==TAB?' on':''}" onclick="TAB='${t}';R()">${t}</button>`).join('');$('#tb').innerHTML=V[TAB]()};
const hubOpen=()=>{if(S.ext&&!S.trim){S.days.shift();S.trim=1}$('#hub').classList.add('on');R()};
const bk=k=>{S.bk[k]=1;R()},add=i=>{const v=$('#a'+i).value.trim();if(v){S.days[i].it.push({n:v,t:'Anytime',k:'s',c:0});R()}},sw=(i,j)=>{S.sw=[i,j];R()};
const pk=k=>{const[i,j]=S.sw,x=S.days[i].it[j],p=(x.k=='f'?FD:PL)[k];x.n=p[0];x.c=p[1];S.sw=0;R()},ad=(k,i)=>{S.days[i].it.push({n:FD[k][0],t:'Anytime',k:'f',c:FD[k][1]});R()};
const ex=()=>{const c=$('#ec').value,a=+$('#ea').value;if(a>0){S.sp[c]+=a;S.ex.push([c,a]);R()}},ca=()=>{const v=$('#ci').value.trim();if(v){S.ck.push([v,0]);R()}},ar=()=>{const t=$('#rt').value.trim();if(t){S.rv.unshift(['You',+$('#rs').value,t]);R()}};
const SWP=()=>{const[i,j]=S.sw,x=S.days[i].it[j],P=x.k=='f'?FD:PL;return `<div class="cd"><b>Swap “${esc(x.n)}” with</b><div class="ps" style="padding:0">${P.map((p,k)=>`<button class="pill" onclick="pk(${k})">${p[0]} · ~${inr(p[1])}</button>`).join('')}<button class="pill" onclick="S.sw=0;R()">Cancel</button></div></div>`};
const RS=()=>`<div class="cd"><b>Restaurants (sample)</b>${FD.map((r,k)=>`<div class="rw"><span>${r[0]} · ~${inr(r[1])}</span><span>${S.days.map((d,i)=>`<button class="pill" onclick="ad(${k},${i})">+ Day ${i+1}</button>`).join('')}</span></div>`).join('')}</div>`;
V.Itinerary=()=>`<div class="rw" style="flex-wrap:wrap;justify-content:flex-start"><button class="pill" onclick="bk('fl')">Flights: ${S.bk.fl?'Booked ✓':'Book '+inr(S.dep.p+S.ret.p)}</button><button class="pill" onclick="bk('ht')">Stay: ${S.bk.ht?'Booked ✓':'Book '+inr(S.hotel)}</button><button class="pill" onclick="S.rs=!S.rs;R()">Restaurants</button></div>${S.bk.fl||S.bk.ht?'<small>Simulated booking. Payment is outside this prototype.</small>':''}${S.sw?SWP():''}${S.rs?RS():''}<small>Costs are sample estimates. Edit any name, swap a place, or add your own.</small>`+S.days.map((d,i)=>`<div class="cd"><b>Day ${i+1} · ${d.d}</b>${d.it.map((x,j)=>`<div class="it"><small>${x.t}</small><input aria-label="Place name" value="${esc(x.n)}" onchange="S.days[${i}].it[${j}].n=this.value;R()"><span class="t2">${x.c?'~'+inr(x.c):'Free'}</span><button class="pill" onclick="sw(${i},${j})">Swap</button><button class="ib" aria-label="Remove ${esc(x.n)}" onclick="S.days[${i}].it.splice(${j},1);R()">×</button></div>`).join('')}<div class="rw"><input id="a${i}" placeholder="Add a place" aria-label="Add a place to day ${i+1}" style="flex:1"><button class="pill" onclick="add(${i})">Add</button></div></div>`).join('');
V.Map=()=>S.days.map((d,i)=>{const P=d.it.map((x,j)=>{let h=0;for(const c of x.n)h=(h*31+c.charCodeAt(0))%997;return[30+(h*7+j*83)%280,30+(h*13+j*47)%200]});return `<div class="cd"><b>Day ${i+1} · ${d.d}</b><svg viewBox="0 0 340 260" role="img" aria-label="Schematic route for day ${i+1}" style="width:100%;background:#eef6f3;border-radius:8px"><polyline fill="none" stroke="#f05325" stroke-width="2" stroke-dasharray="5 4" points="${P.map(p=>p.join(',')).join(' ')}"/>${P.map((p,j)=>`<circle cx="${p[0]}" cy="${p[1]}" r="11" fill="#f05325"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">${j+1}</text>`).join('')}</svg>${d.it.map((x,j)=>`<small>${j+1}. ${esc(x.n)} (${x.t})</small>`).join('')}</div>`}).join('')+'<small>Schematic only: pins show the visit order and their positions are illustrative, not geographic. A real build would use a live map such as Leaflet with OpenStreetMap.</small>';
V.Budget=()=>{const fp=S.dep.p+S.ret.p,Q=[['Flights',fp,fp,S.bk.fl?fp:0],['Stay',S.hotel,S.hotel,S.bk.ht?S.hotel:0],['Food',S.al.Food,sum('f'),S.sp.Food,'Food'],['Activities',S.al.Activities,sum('s'),S.sp.Activities,'Activities'],['Local transport',S.al.Transport,0,S.sp.Transport,'Transport'],['Buffer',S.al.Buffer,0,S.sp.Buffer,'Buffer']],al=Q.reduce((a,r)=>a+r[1],0),sp=Q.reduce((a,r)=>a+r[3],0);
return `<div class="cd"><div class="rw"><b>Total budget</b><input type="number" min="0" style="width:110px" value="${S.budget}" aria-label="Total budget" onchange="S.budget=+this.value||0;R()"></div><small>Allocated ${inr(al)} · ${S.budget>=al?'Unallocated '+inr(S.budget-al):'Over-allocated by '+inr(al-S.budget)} · Spent ${inr(sp)}</small></div>`+Q.map(r=>{const o=r[3]>r[1];return `<div class="cd${o?' ov':''}"><div class="rw"><b>${r[0]}</b>${r[4]?`<input type="number" min="0" style="width:100px" value="${r[1]}" aria-label="${r[0]} allocation" onchange="S.al.${r[4]}=+this.value||0;R()">`:`<span>${inr(r[1])}</span>`}</div><div class="pb"><i style="width:${r[1]?Math.min(100,r[3]/r[1]*100):0}%"></i></div><small>Planned ${inr(r[2])} · Spent ${inr(r[3])} · ${o?'Over by '+inr(r[3]-r[1]):'Left '+inr(r[1]-r[3])}${r[2]>r[1]?' · Plan exceeds allocation':''}</small></div>`}).join('')+`<div class="cd"><b>Log an expense</b><div class="rw"><select id="ec" aria-label="Category"><option>Food</option><option>Activities</option><option>Transport</option><option>Buffer</option></select><input id="ea" type="number" min="0" placeholder="Amount" aria-label="Amount" style="width:100px"><button class="pill" onclick="ex()">Add</button></div>${S.ex.slice(-3).map(e=>`<small>${e[0]}: ${inr(e[1])}</small>`).join('')}</div>`};
V.Checklist=()=>`<div class="cd"><b>Travel checklist</b><small>${S.ck.filter(x=>x[1]).length} of ${S.ck.length} done. Suggested for a short beach-city trip in November (sample list).</small>${S.ck.map((x,i)=>`<label class="ck"><input type="checkbox" ${x[1]?'checked':''} onchange="S.ck[${i}][1]=this.checked?1:0;R()"> ${esc(x[0])}</label>`).join('')}<div class="rw"><input id="ci" placeholder="Add an item" aria-label="Add checklist item" style="flex:1"><button class="pill" onclick="ca()">Add</button></div></div>`;
V.Safety=()=>`<div class="cd"><b>Local scams to watch for</b><ul><li>Agree the fare before getting into an auto or taxi, or use a metered or app-based cab.</li><li>Buy attraction tickets only at official counters or apps, not from people offering quick entry.</li><li>Check the payee name before paying by UPI or QR code.</li><li>Book only through the app and ignore unsolicited discount links.</li></ul></div><div class="cd"><b>Health advisory</b><ul><li>Drink sealed or filtered water and carry some with you.</li><li>Warm, humid weather: use sunscreen, wear a hat and drink often.</li><li>Carry your regular medicines and a basic first-aid kit.</li><li>Eat freshly cooked food from busy places.</li></ul></div><small>General tips and sample content, not medical advice. I cannot verify live advisories for your dates, so check official tourism, weather and health sources before you travel.</small>`;
V.Reviews=()=>`<small>Sample reviews from fellow travellers (simulated).</small>`+S.rv.map(r=>`<div class="cd"><b>${'★'.repeat(r[1])}${'☆'.repeat(5-r[1])}</b><span>${esc(r[2])}</span><small>${esc(r[0])}</small></div>`).join('')+`<div class="cd"><b>Review this plan</b><div class="rw"><select id="rs" aria-label="Rating">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select><input id="rt" placeholder="Share a tip for other travellers" aria-label="Review text" style="flex:1"></div><button class="pill" onclick="ar()">Post review</button></div>`;
$('#hb').onclick=()=>$('#hub').classList.remove('on');

const CFG={proxy:'',model:'claude-sonnet-5-5'};let HIST=[];
const ss=k=>{try{return sessionStorage.getItem(k)}catch{return null}};
const sk=()=>{const v=$('#kf').value.trim();try{sessionStorage.setItem('tkey',v)}catch{}bot(v?'Key saved for this tab only. Type a question to try live AI.':'No key entered.')};
$('#st').onclick=()=>card(`<div class="cd"><b>AI settings</b><small>For local demos only: paste an Anthropic API key. It stays in this browser tab and is never saved in the code. For public hosting, use the proxy instead (see README) and never commit a key.</small><input id="kf" type="password" placeholder="API key" aria-label="API key" autocomplete="off"><button class="pill" onclick="sk()">Save for this tab</button></div>`);
const SYS=()=>`You are Trippy, the AI travel assistant inside the Cleartrip app, helping Arjun plan a short Vizag trip after work (work Mon-Wed). Be warm, specific and brief (under 90 words). You have NO live prices, availability, weather or advisories: never invent them, say when something needs checking, and label any cost as an estimate. Current plan: ${JSON.stringify({days:S.days,flights:{dep:S.dep,ret:S.ret},hotel:S.hotel,budget:S.budget,allocations:S.al,spent:S.sp})}. Reply with ONLY a JSON object {"reply":string,"actions":[...]}. Include actions only when the user asks to change the plan. Each action is one of {"op":"add","day":1,"name":string,"slot":"Morning|Afternoon|Evening|Anytime","kind":"s|f","cost":number}, {"op":"remove","day":1,"index":1}, {"op":"rename","day":1,"index":1,"name":string}, {"op":"budget","total":number}. day and index are 1-based.`;
const apply=A=>A.slice(0,5).map(a=>{if(a.op=='budget'&&+a.total>0){S.budget=+a.total;return 'Total budget set to '+inr(+a.total)}const d=S.days[(a.day|0)-1],i=(a.index|0)-1;if(!d)return null;
if(a.op=='add'&&a.name){d.it.push({n:String(a.name).slice(0,60),t:a.slot||'Anytime',k:a.kind=='f'?'f':'s',c:Math.max(0,+a.cost||0)});return `Added ${a.name} to Day ${a.day}`}
if(a.op=='remove'&&d.it[i]){const n=d.it[i].n;d.it.splice(i,1);return `Removed ${n} from Day ${a.day}`}
if(a.op=='rename'&&d.it[i]&&a.name){d.it[i].n=String(a.name).slice(0,60);return `Renamed item ${a.index} on Day ${a.day}`}return null}).filter(Boolean);
const ask=async t=>{HIST.push({role:'user',content:t});const w=document.createElement('div');w.className='r';w.innerHTML=AV+'<div class="col"><div class="ln">Trippy is thinking...</div></div>';ch.append(w);sc();
try{const h={'content-type':'application/json'};if(!CFG.proxy){h['x-api-key']=ss('tkey');h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true'}
let m=HIST.slice(-8);if(m[0].role!='user')m.shift();
const q=await fetch(CFG.proxy||'https://api.anthropic.com/v1/messages',{method:'POST',headers:h,body:JSON.stringify({model:CFG.model,max_tokens:600,system:SYS(),messages:m})});
if(!q.ok)throw new Error('error '+q.status);const d=await q.json(),raw=(d.content||[]).map(c=>c.text||'').join('');let o;try{o=JSON.parse(raw.replace(/```json|```/g,'').trim())}catch{o={reply:raw}}
HIST.push({role:'assistant',content:raw});w.remove();bot(esc(o.reply||'Done.'));const L=apply(Array.isArray(o.actions)?o.actions:[]);
if(L.length){face();card(`<div class="cd"><b>Updated your plan</b><ul>${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`);chips([['Open trip hub',hubOpen]])}}
catch(e){w.remove();HIST.pop();bot('I could not reach the AI ('+esc(e.message)+'). Check your key or proxy in AI settings, then try again.')}};

let AC,MUTE=0;
const tone=(f,t,d,v)=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.05)}catch{}};
const snd={tap:()=>{if(!MUTE)tone(660,0,.14,.03)},ok:()=>{if(MUTE)return;tone(523,0,1.4,.05);tone(784,.85,1.4,.05);tone(1319,.85,1,.015);tone(1047,1.7,1.4,.05)}};
document.addEventListener('click',e=>{if(e.target.closest('.pill,.tab,.tp'))snd.tap()});
$('#sn').onclick=()=>{MUTE=!MUTE;$('#sn').style.opacity=MUTE?.35:1;$('#sn').setAttribute('aria-label',MUTE?'Sound off':'Sound on')};
$('#go').onclick=()=>{$('.sh').classList.add('on');start()};$('#x').onclick=$('#bk').onclick=()=>$('.sh').classList.remove('on');
$('#f').onsubmit=e=>{e.preventDefault();const i=e.target.q,t=i.value.trim();if(!t)return;i.value='';user(esc(t));if(CFG.proxy||ss('tkey'))ask(t);else bot('Live AI is not connected yet. Tap the settings icon at the top to add a key for a local demo, or set up the proxy (see README). Meanwhile, use the suggested options.')};
</script></body></html>
